
syntax = "proto3";

package UserService;

// User-specific request and response data
message CreateUserRequest {
    string user_name = 1;
    int64 mobile = 2; // Mobile as a 10-digit integer
    string fcm_token = 3;
    string email = 4; // Optional
    string user_type = 5; // User type as string
}

// Request message for updating a user
message UpdateUserRequest {
    int64 user_id = 1; // Unique identifier for the user as a number
    string user_name = 2;
    int64 mobile = 3; // Mobile as a 10-digit integer
    string fcm_token = 4;
    string email = 5; // Optional
    string user_type = 6; // User type as string
}

message GetUserDetailsRequest {
   int64 user_id = 1; // Unique identifier for the user  Or another identifier
}